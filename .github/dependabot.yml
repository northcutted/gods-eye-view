version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /
      - /.github/container-tools
    schedule:
      interval: weekly
    ignore:
      # A new Node major needs an intentional runtime/compatibility decision.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/container-browser
    schedule:
      interval: weekly
