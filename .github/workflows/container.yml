name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['24.14.0', '26.8.2']
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check:boundaries
      - run: npm test

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      created: ${{ steps.meta.outputs.created }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          version="sha-${GITHUB_SHA}"
          publish=false
          if [[ "$EVENT" != pull_request && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            publish=true
          elif [[ "$EVENT" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            version="$GITHUB_REF_NAME"
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  check-image:
    needs: [checks, prepare]
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: podman build --format oci --tag localhost/gods-eye-view:check .
      - run: CONTAINER_ENGINE=podman node scripts/test-container.mjs localhost/gods-eye-view:check

  build:
    needs: [checks, prepare]
    if: needs.prepare.outputs.publish == 'true'
    # Public repositories get these standard native runners free of charge.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # No OIDC permission in the job that executes the Dockerfile.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          # Disable the action's security.insecure default. Buildx may still allow
          # network.host inside its isolated builder; no build requests that grant.
          buildkitd-flags: --debug
      - name: Verify the pinned distroless base signature
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: |
          cosign verify gcr.io/distroless/nodejs26-debian13:nonroot@sha256:f7e3539249fa844f7019255d3ed1acb5faf626006607a602f8a24d59f0a97c6c \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build OCI image with per-platform provenance and SBOM
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Trusted builds push staging tags; promotion follows verification.
          outputs: type=image,push=true,oci-mediatypes=true
          tags: ${{ needs.prepare.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ needs.prepare.outputs.version }}
            OCI_CREATED=${{ needs.prepare.outputs.created }}
      - name: Test the built image with a read-only root and no network
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          podman pull "$IMAGE@$DIGEST"
          CONTAINER_ENGINE=podman node scripts/test-container.mjs "$IMAGE@$DIGEST"
      - name: Gate fixable high and critical image vulnerabilities
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: registry:${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}
          grype-version: v0.118.0
          severity-cutoff: high
          # Report wont-fix, not-fixed, and unknown states without blocking.
          # JSON retains these findings in ignoredMatches; this is not VEX.
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: /tmp/gev-vulnerabilities.json
          cache-db: false
          config: .github/grype.yaml
      - name: Report fixable and unfixed vulnerability counts
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          set -euo pipefail
          # A missing/broken report is a scan failure, not a clean image.
          test -s /tmp/gev-vulnerabilities.json
          jq -r '
            if (.matches | type) != "array" or ((.ignoredMatches // []) | type) != "array"
            then error("Invalid Grype report: expected match arrays") else . end
            | (.matches + (.ignoredMatches // []))
            | map(select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")) as $findings
            | "### Image vulnerability policy",
              "",
              "Only High/Critical findings with an available fix block release. All findings remain in the JSON artifact.",
              "",
              "| Fix state | High/Critical findings | Handling |",
              "| --- | --- | --- |",
              (["fixed", "wont-fix", "not-fixed", "unknown"][] as $state
                | ($findings | map(select((.vulnerability.fix.state // "unknown") == $state)) | length) as $count
                | "| \($state) | \($count) | \(if $state == "fixed" then "Block" else "Report only" end) |")
          ' /tmp/gev-vulnerabilities.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vulnerabilities-${{ matrix.arch }}
          path: /tmp/gev-vulnerabilities.json
          retention-days: 90
      - name: Record the tested platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  index:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: index
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CREATED: ${{ needs.prepare.outputs.created }}
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            digest=$(<"digests/$arch")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$IMAGE@$digest")
          done
          staging="$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$staging" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation 'index:org.opencontainers.image.licenses=MIT' "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [prepare, index]
    permissions:
      actions: read
      id-token: write
      packages: write
    # The official verifier requires a full version tag for this reusable workflow.
    # All ordinary actions above are pinned by commit; do not replace this with a SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.prepare.outputs.image }}
      digest: ${{ needs.index.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-and-promote:
    needs: [prepare, index, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify SLSA provenance, archive evidence, then promote the same digest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.index.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          source_ref=(--source-branch "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then source_ref=(--source-tag "$GITHUB_REF_NAME"); fi
          slsa-verifier verify-image "$IMAGE@$DIGEST" \
            --source-uri "github.com/$GITHUB_REPOSITORY" "${source_ref[@]}" \
            --print-provenance > evidence/slsa-provenance.json
          jq -e --arg sha "$GITHUB_SHA" \
            'any(.. | objects; .configSource?.digest?.sha1 == $sha and .configSource?.entryPoint == ".github/workflows/container.yml")' evidence/slsa-provenance.json
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > evidence/index.json
          jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' evidence/index.json
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --format "{{json (index .SBOM \"linux/$arch\")}}" > "evidence/sbom-$arch.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --format "{{json (index .Provenance \"linux/$arch\")}}" > "evidence/buildkit-provenance-$arch.json"
            jq -e '.SPDX.packages | length > 0' "evidence/sbom-$arch.json"
            jq -e '.SLSA | type == "object"' "evidence/buildkit-provenance-$arch.json"
          done
          tags=("sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$VERSION")
            if [[ "$VERSION" != *-* ]]; then tags+=(latest); fi
          else
            tags+=(main)
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$actual" == "$DIGEST" ]]
          done
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee evidence/image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
