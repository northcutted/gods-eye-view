name: Container build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Both paths check the app first. PRs and non-release branches only build/test;
  # eligible main/tag runs stage images, sign build records, then publish tags.
  # Keep job IDs stable; the names below are the labels shown in GitHub Actions.
  checks:
    name: Check application (Node.js ${{ matrix.node }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['24.14.0', '${{ needs.prepare.outputs.node }}']
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check code formatting
        run: npm run format:check
      - name: Check package import boundaries
        run: npm run check:boundaries
      - name: Run unit tests
        run: npm test

  prepare:
    name: Choose build-only or publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      created: ${{ steps.meta.outputs.created }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      release: ${{ steps.meta.outputs.release }}
      tags: ${{ steps.meta.outputs.tags }}
      node: ${{ steps.toolchain.outputs.node }}
      runtime: ${{ steps.toolchain.outputs.runtime }}
      buildkit: ${{ steps.toolchain.outputs.buildkit }}
      sbom: ${{ steps.toolchain.outputs.sbom }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name, version, and publishing mode
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/container-publication.mjs prepare >> "$GITHUB_OUTPUT"
      - name: Read dependency-managed runtime and build tools
        id: toolchain
        run: node scripts/container-toolchain.mjs >> "$GITHUB_OUTPUT"

  check-image:
    name: Test container without publishing (${{ matrix.runner == 'ubuntu-24.04-arm' && 'ARM64' || 'AMD64' }})
    needs: [checks, prepare]
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build local container image
        run: podman build --format oci --tag localhost/gods-eye-view:check .
      - name: Test container startup, restrictions, and shutdown
        run: CONTAINER_ENGINE=podman node scripts/test-container.mjs localhost/gods-eye-view:check
      # Chrome for Testing provides Linux AMD64 builds. Both image architectures
      # still run the runtime checks above; Chrome is never added to the image.
      - name: Test first-run browser experience (AMD64)
        if: matrix.runner == 'ubuntu-24.04'
        uses: ./.github/actions/container-browser
        with:
          image: localhost/gods-eye-view:check
          artifact-name: container-browser-check-amd64

  build:
    name: Build, test, and scan image (${{ matrix.arch }})
    needs: [checks, prepare]
    if: needs.prepare.outputs.publish == 'true'
    # Public repositories get these standard native runners free of charge.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # No OIDC permission in the job that executes the Dockerfile.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install digest-pinned Buildx, Cosign, and Grype
        run: node scripts/container-toolchain.mjs --install --scan-tools
      - name: Start the pinned, isolated BuildKit builder
        env:
          BUILDKIT_IMAGE: ${{ needs.prepare.outputs.buildkit }}
        run: |
          docker buildx create --name gev --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --buildkitd-flags=--debug --use
          docker buildx inspect --bootstrap
      - name: Verify Google's signature on the pinned base image
        env:
          RUNTIME_IMAGE: ${{ needs.prepare.outputs.runtime }}
        run: |
          cosign verify "$RUNTIME_IMAGE" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Trusted builds push staging tags; promotion follows verification.
          outputs: type=image,push=true,oci-mediatypes=true
          tags: ${{ needs.prepare.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          provenance: mode=max
          attests: type=sbom,generator=${{ needs.prepare.outputs.sbom }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ needs.prepare.outputs.version }}
            OCI_CREATED=${{ needs.prepare.outputs.created }}
      - name: Test container startup, restrictions, and shutdown
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          podman pull "$IMAGE@$DIGEST"
          CONTAINER_ENGINE=podman node scripts/test-container.mjs "$IMAGE@$DIGEST"
      - name: Test first-run browser experience (AMD64)
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/container-browser
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}
          artifact-name: container-browser-release-amd64
      - name: Scan image and block fixable High/Critical findings
        id: scan
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # JSON retains unfixed findings in ignoredMatches; this is not VEX.
        run: grype "registry:$IMAGE@$DIGEST" --config .github/grype.yaml --only-fixed --fail-on high --output json --file /tmp/gev-vulnerabilities.json
      - name: Summarize High/Critical findings by fix availability
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          set -euo pipefail
          # A missing/broken report is a scan failure, not a clean image.
          test -s /tmp/gev-vulnerabilities.json
          jq -r '
            if (.matches | type) != "array" or ((.ignoredMatches // []) | type) != "array"
            then error("Invalid Grype report: expected match arrays") else . end
            | (.matches + (.ignoredMatches // []))
            | map(select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")) as $findings
            | "### Image vulnerability policy",
              "",
              "Only High/Critical findings with an available fix block release. All findings remain in the JSON artifact.",
              "",
              "| Fix state | High/Critical findings | Handling |",
              "| --- | --- | --- |",
              (["fixed", "wont-fix", "not-fixed", "unknown"][] as $state
                | ($findings | map(select((.vulnerability.fix.state // "unknown") == $state)) | length) as $count
                | "| \($state) | \($count) | \(if $state == "fixed" then "Block" else "Report only" end) |")
          ' /tmp/gev-vulnerabilities.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vulnerabilities-${{ matrix.arch }}
          path: /tmp/gev-vulnerabilities.json
          retention-days: 90
      - name: Record tested image digest (content ID)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - name: Share tested image digest with release jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  index:
    name: Assemble multi-platform image
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Install digest-pinned Buildx
        run: node scripts/container-toolchain.mjs --install
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine AMD64 and ARM64 images under a staging tag
        id: index
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CREATED: ${{ needs.prepare.outputs.created }}
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            digest=$(<"digests/$arch")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$IMAGE@$digest")
          done
          staging="$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$staging" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation 'index:org.opencontainers.image.description=Real-time Earth intelligence console with a hardened distroless Node.js runtime' \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation 'index:org.opencontainers.image.licenses=MIT' "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  provenance:
    name: Sign build provenance (SLSA)
    needs: [prepare, index]
    permissions:
      actions: read
      id-token: write
      packages: write
    # The official verifier requires a full version tag for this reusable workflow.
    # All ordinary actions above are pinned by commit; do not replace this with a SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.prepare.outputs.image }}
      digest: ${{ needs.index.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-and-promote:
    name: Verify evidence and publish image tags
    needs: [prepare, index, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SLSA provenance verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Install digest-pinned Buildx
        run: node scripts/container-toolchain.mjs --install
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify build records and publish image tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.index.outputs.digest }}
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node scripts/container-toolchain.mjs > evidence/toolchain.txt
          source_ref=(--source-branch "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then source_ref=(--source-tag "$GITHUB_REF_NAME"); fi
          slsa-verifier verify-image "$IMAGE@$DIGEST" \
            --source-uri "github.com/$GITHUB_REPOSITORY" "${source_ref[@]}" \
            --print-provenance > evidence/slsa-provenance.json
          jq -e --arg sha "$GITHUB_SHA" \
            'any(.. | objects; .configSource?.digest?.sha1 == $sha and .configSource?.entryPoint == ".github/workflows/container.yml")' evidence/slsa-provenance.json
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > evidence/index.json
          jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' evidence/index.json
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --format "{{json (index .SBOM \"linux/$arch\")}}" > "evidence/sbom-$arch.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --format "{{json (index .Provenance \"linux/$arch\")}}" > "evidence/buildkit-provenance-$arch.json"
            jq -e '.SPDX.packages | length > 0' "evidence/sbom-$arch.json"
            jq -e '.SLSA | type == "object"' "evidence/buildkit-provenance-$arch.json"
          done
          read -r -a tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$actual" == "$DIGEST" ]]
          done
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > evidence/image.txt
          node scripts/container-publication.mjs evidence >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified build records and released image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  draft-release:
    name: Create draft GitHub Release (version tags only)
    needs: [prepare, index, verify-and-promote]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    # Only tag builds reach this job. It does not create Git tags, build, or sign.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-evidence-${{ github.sha }}
          path: evidence
      - name: Download both architecture scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vulnerabilities-*
          path: scans
      - name: Prepare editable notes and attach container evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.index.outputs.digest }}
        run: node scripts/container-publication.mjs draft >> "$GITHUB_STEP_SUMMARY"
